# Enables GitHub auto-merge on Dependabot pull requests for minor and patch
# updates only. Major updates are left for manual review, matching the
# previous Renovate automerge policy.
#
# Prerequisites (repository settings):
#   - "Allow auto-merge" must be enabled under Settings > General.
#   - The target branch needs a branch protection rule (or ruleset) that
#     requires the "test" status check; otherwise the merge does not wait
#     for CI.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'junkurihara/js-aws-signature-v4'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
